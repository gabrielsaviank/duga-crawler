services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    restart: unless-stopped

  crawler:
    build: .
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      CRAWLER_RAW_DIRECTORY: /data/raw/estonian-register
      TZ: America/Sao_Paulo
    volumes:
      - ./crawler-data:/data/raw
    restart: unless-stopped

volumes:
  mongo_data: